[workspace]
resolver = "3"
members = ["crates/katak-core", "crates/katak", "tools/katak-gen", "tools/katak-bench"]
default-members = ["crates/katak-core", "crates/katak"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
katak-core = { path = "crates/katak-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

# The core is exercised with large inputs in tests; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
