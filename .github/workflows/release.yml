name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: katak.exe
          - name: linux-x64
            # The oldest supported runner keeps the glibc requirement low.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: katak
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: katak
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: katak
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p katak --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/katak-${{ github.ref_name }}-${{ matrix.name }}${ext}"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceExe=$PWD\target\${{ matrix.target }}\release\katak.exe" "/O$PWD\dist" "/Fkatak-${{ github.ref_name }}-windows-x64-setup" packaging\windows\katak.iss

      - uses: actions/upload-artifact@v4
        with:
          name: katak-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Katak ${GITHUB_REF_NAME}" --notes "${notes:-Katak ${GITHUB_REF_NAME}}"
