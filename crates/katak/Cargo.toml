[package]
name = "katak"
description = "Katak: a fast, non-freezing viewer/editor for huge CSV/TSV files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["csv", "csv-viewer", "tsv", "large-files", "gui"]
categories = ["gui", "text-processing", "visualization"]
publish = false

[[bin]]
name = "katak"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence", "clipboard", "accesskit"] }
katak-core.workspace = true
memmap2 = "0.9.12"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

# Icon and version resource of katak.exe (build.rs). For build
# dependencies the cfg is the host's, not the target's.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
